name: watch
on:
  schedule:
    - cron: '30 16 * * 1'   # Monday, after the local weekly run pushes its rows
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Watch lines against their triggers
        run: python watch/watch.py
      - name: Every figure against figures.csv
        run: python reproduce.py
